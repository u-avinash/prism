name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Compile and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Compile production modules
        run: >
          python -m py_compile
          ui/server.py
          agents/workflow.py
          ingestion/api.py
          storage/database.py
          storage/incident_repository.py
          storage/telemetry_repository.py

      - name: Run deterministic unit tests
        run: python -m pytest
